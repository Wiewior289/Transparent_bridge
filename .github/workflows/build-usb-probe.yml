name: Build USB Probe APK

on:
  push:
    branches:
      - experiment/cdc-ether-userland-replay
      - refactor/cdc-ecm-modules
    paths:
      - 'usb_probe/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/build-usb-probe.yml'
  pull_request:
    branches:
      - experiment/cdc-ether-userland-replay
    paths:
      - 'usb_probe/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/build-usb-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-usb-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build USB Probe debug APK
        run: gradle :usb_probe:assembleDebug --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: usb-probe-debug-apk
          path: usb_probe/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
