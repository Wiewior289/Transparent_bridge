name: USB Probe APK

on:
  push:
    branches:
      - experiment/generic-cdc-ether-usb-probe
    paths:
      - "usb_probe/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - ".github/workflows/usb-probe-build.yml"
  pull_request:
    paths:
      - "usb_probe/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - ".github/workflows/usb-probe-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Run USB Probe unit tests
        run: gradle :usb_probe:testDebugUnitTest --no-configuration-cache
      - name: Build probe APK
        run: gradle :usb_probe:assembleDebug --no-configuration-cache
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: generic-cdc-usb-probe-debug
          path: usb_probe/build/outputs/apk/debug/usb_probe-debug.apk
          if-no-files-found: error
