name: USB Probe APK build

on:
  push:
    branches:
      - diagnostics/kernel-cdc-recovery
    paths:
      - "usb_probe/**"
      - "gradlew"
      - "gradle/**"
      - ".github/workflows/usb-probe-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-usb-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build USB Probe APK
        run: gradle -p usb_probe assembleDebug --no-configuration-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: usb-probe-debug-apk
          path: usb_probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
